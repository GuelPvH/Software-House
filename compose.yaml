# =============================================================================
# Ambiente de desenvolvimento — container monolítico.
#
# Um único serviço de aplicação (Apache + PHP + Node) substitui os três
# serviços anteriores (nginx, app/php-fpm, vite). Para iniciar o Vite HMR:
#
#   docker exec -it software-house_app bash
#   npm run build    # compila os assets para produção
#   npm run dev      # inicia o Vite com HMR (porta 5175)
#
# Sem a chave `version:` — obsoleta no Compose v2 e gera warning.
# Toda porta publicada vem do `.env`: conflito se resolve lá, nunca aqui.
# Nenhuma credencial literal neste arquivo.
# =============================================================================

name: software-house-ppw

services:
  # ---------------------------------------------------------------------------
  # app — Apache + PHP 8.4 + Node 24
  # Container único que substitui nginx + php-fpm + vite.
  # ---------------------------------------------------------------------------
  app:
    container_name: ${CONTAINER_PREFIX:-${COMPOSE_PROJECT_NAME:-app}}_app
    build:
      context: .
      dockerfile: docker/monolith/Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
        NODE_VERSION: ${NODE_VERSION:-24}
    image: ${COMPOSE_PROJECT_NAME:-software-house-ppw}-app:dev
    restart: unless-stopped
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      PHP_IDE_CONFIG: serverName=${COMPOSE_PROJECT_NAME:-software-house-ppw}
      VITE_PORT: ${VITE_PORT:-5175}
      APP_PORT: ${APP_PORT:-8000}
    ports:
      # Aplicação (Apache)
      - "${APP_PORT:-8000}:80"
      # Vite HMR — só quando `npm run dev` for iniciado manualmente dentro do container
      - "127.0.0.1:${VITE_PORT:-5175}:5175"
    volumes:
      # Código-fonte via bind mount
      - .:/var/www/html
      # `vendor` em volume nomeado: evita lentidão de 30k+ arquivos em Docker Desktop
      - vendor:/var/www/html/vendor
      # `node_modules` em volume nomeado: mesma razão do vendor
      - node_modules:/var/www/html/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [net]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1/favicon.ico"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  queue:
    container_name: ${CONTAINER_PREFIX:-${COMPOSE_PROJECT_NAME:-app}}_queue
    image: ${COMPOSE_PROJECT_NAME:-software-house-ppw}-app:dev
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=60"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
    networks: [net]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3

  scheduler:
    container_name: ${CONTAINER_PREFIX:-${COMPOSE_PROJECT_NAME:-app}}_scheduler
    image: ${COMPOSE_PROJECT_NAME:-software-house-ppw}-app:dev
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
    networks: [net]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # MySQL — banco de dados
  # ---------------------------------------------------------------------------
  mysql:
    container_name: ${CONTAINER_PREFIX:-${COMPOSE_PROJECT_NAME:-app}}_mysql
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-software-house-ppw}-mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_DATABASE:-software_house}
      MYSQL_USER: ${DB_USERNAME:-software_house}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [net]
    healthcheck:
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -D "$$MYSQL_DATABASE" -e 'SELECT 1' > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Redis — cache, sessão e fila.
  # ---------------------------------------------------------------------------
  redis:
    container_name: ${CONTAINER_PREFIX:-${COMPOSE_PROJECT_NAME:-app}}_redis
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks: [net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Ferramentas administrativas — só sobem com o profile `tools`.
  # ---------------------------------------------------------------------------
  phpmyadmin:
    container_name: ${CONTAINER_PREFIX:-${COMPOSE_PROJECT_NAME:-app}}_phpmyadmin
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    profiles: [tools]
    environment:
      PMA_HOST: ${DB_HOST:-mysql}
      PMA_PORT: ${DB_PORT:-3306}
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 64M
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8082}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [net]

  mailpit:
    container_name: ${CONTAINER_PREFIX:-${COMPOSE_PROJECT_NAME:-app}}_mailpit
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    profiles: [tools]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8026}:8025"
    networks: [net]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  mailpit_data:
  vendor:
  node_modules:
