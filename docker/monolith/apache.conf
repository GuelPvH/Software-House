# Oculta a versão do Apache nas respostas — diretiva global, fora do VirtualHost.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Permite que o Laravel use seu próprio .htaccess (mod_rewrite).
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Headers de segurança — equivalente ao bloco add_header do nginx.
    Header always set X-Content-Type-Options  "nosniff"
    Header always set X-Frame-Options         "SAMEORIGIN"
    Header always set Referrer-Policy         "strict-origin-when-cross-origin"

    # Limite de upload: alinhado com upload_max_filesize do PHP (32 M).
    LimitRequestBody 33554432

    # Logs vão para stdout/stderr do container, não para arquivo interno.
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
